name: Cardmarket Preise täglich aktualisieren & GitHub Pages deployen

on:
  schedule:
    # Läuft jeden Tag automatisch um 06:00 Uhr morgens
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Produktbilder-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: ./public/images
          key: cm-images-v1-${{ github.run_id }}
          restore-keys: |
            cm-images-v1-

      - name: Cardmarket-Preise & Sealed-Bilder aktualisieren
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            node update_static_data.js --force --with-sealed-images
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main || true
            git add data/portfolio.json public/data/portfolio.json public/data/catalog_compact.json
            git diff --staged --quiet || (git commit -m "Automatischer Cardmarket Preis-Sync" && git push)
          else
            node update_static_data.js --with-sealed-images
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische App (public/) für GitHub Pages packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
